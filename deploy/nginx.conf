# Nginx — /etc/nginx/sites-available/dahom
# بعداً: ln -s /etc/nginx/sites-available/dahom /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        (برای HTTPS با certbot: sudo certbot --nginx -d dahom.example.com)

server {
    listen 80;
    server_name dahom.example.com;   # ← دامنهٔ خودتان را بگذارید

    # آپلود ویدیو تا ۴ گیگابایت
    client_max_body_size 4096M;

    # تمام درخواست‌ها به Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # پخش ویدیو (Range Request) — بافرینگ خاموش تا عقب/جلو بردن ویدیو درست کار کند
    location /media/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
