# ============================================================
# استقرار روی Render (رایگان)
# ۱) پروژه را به گیت‌هاب بدهید
# ۲) در Render: New + → Blueprint  (خودش این فایل را پیدا می‌کند)
# ============================================================
services:
  - type: web
    name: class-dahom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: dahom123        # ⚠️ حتماً عوض کنید
      - key: ADMIN_PANEL_PATH
        value: panel
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: COOKIE_SECURE
        value: "1"
      # زرین‌پال — مرچنت‌کد را در داشبورد Render پر کنید
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: ZARINPAL_SANDBOX
        value: "1"   # بعد از تست واقعی: 0
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
